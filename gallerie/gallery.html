    const grid = document.getElementById("galleryGrid");
    const emptyState = document.getElementById("galleryEmpty");
    const filterBtns = document.querySelectorAll(".galleryFilterBtn");

    let currentFilter = "all";
    let currentIndex = 0;
    let visibleImages = galleryImages;

    function renderGrid() {
      visibleImages =
        currentFilter === "all"
          ? galleryImages
          : galleryImages.filter((img) => img.category === currentFilter);

      grid.innerHTML = "";

      if (visibleImages.length === 0) {
        emptyState.hidden = false;
        return;
      }
      emptyState.hidden = true;

      visibleImages.forEach((img, index) => {
        const item = document.createElement("div");
        item.className = "galleryItem";
        item.innerHTML = `
          <img src="${img.src}" alt="${img.alt}" class="galleryImage" loading="lazy" />
          <div class="galleryOverlay">
            <span class="galleryTag">${img.category}</span>
          </div>
        `;
        item.addEventListener("click", () => openLightbox(index));
        grid.appendChild(item);
      });
    }

    filterBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        filterBtns.forEach((b) => b.classList.remove("isActive"));
        btn.classList.add("isActive");
        currentFilter = btn.dataset.filter;
        renderGrid();
      });
    });

    /* ── lightbox ── */
    const lightbox = document.getElementById("galleryLightbox");
    const lightboxImg = document.getElementById("galleryLightboxImg");
    const closeBtn = document.getElementById("galleryLightboxClose");
    const prevBtn = document.getElementById("galleryLightboxPrev");
    const nextBtn = document.getElementById("galleryLightboxNext");

    function openLightbox(index) {
      currentIndex = index;
      updateLightboxImage();
      lightbox.classList.add("isOpen");
    }

    function updateLightboxImage() {
      const img = visibleImages[currentIndex];
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
    }

    function closeLightbox() {
      lightbox.classList.remove("isOpen");
      lightboxImg.src = "";
    }

    function showPrev() {
      currentIndex = (currentIndex - 1 + visibleImages.length) % visibleImages.length;
      updateLightboxImage();
    }

    function showNext() {
      currentIndex = (currentIndex + 1) % visibleImages.length;
      updateLightboxImage();
    }

    closeBtn.addEventListener("click", closeLightbox);
    prevBtn.addEventListener("click", showPrev);
    nextBtn.addEventListener("click", showNext);

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    window.addEventListener("keydown", (e) => {
      if (!lightbox.classList.contains("isOpen")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") showPrev();
      if (e.key === "ArrowRight") showNext();
    });

    renderGrid();
  })();
